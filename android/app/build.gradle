apply plugin: 'com.android.application'

android {
    namespace "com.ferbersleeptimer.babytracker"
    compileSdk 36

    signingConfigs {
        release {
            if (project.hasProperty('MY_APP_UPLOAD_STORE_FILE')) {
                storeFile file(MY_APP_UPLOAD_STORE_FILE)
                storePassword MY_APP_UPLOAD_STORE_PASSWORD
                keyAlias MY_APP_UPLOAD_KEY_ALIAS
                keyPassword MY_APP_UPLOAD_KEY_PASSWORD
            }
        }
    }

    defaultConfig {
        applicationId "com.ferbersleeptimer.babytracker"
        minSdk rootProject.ext.minSdkVersion
        targetSdk 36
        versionCode 13          // bumped: every Play Store update needs a higher number
        versionName "1.4.0"     // bumped for the new Script and Info features; change as you like
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir {
        dirs 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar', '*.include'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    // Fixed: variables.gradle defines androidxJunitVersion, not androidxExtJunitVersion
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation("com.google.android.gms:play-services-ads:25.5.0")
    // Added: standard Capacitor line for Cordova-based plugins
    implementation project(':capacitor-cordova-android-plugins')
}

// Added: pulls in your Capacitor plugins (local notifications, preferences, haptics,
// keep-awake, status bar, app). This file is generated by `npx cap sync android`.
apply from: 'capacitor.build.gradle'

try {
    def googleServicesJSON = file('google-services.json')
    if (googleServicesJSON.exists()) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch (Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied.")
}