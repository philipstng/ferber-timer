workflows:
  android-release:
    name: Build & Publish Android App Bundle (.aab) to Google Play
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      vars:
        PACKAGE_NAME: "com.ferbersleeptimer.babytracker"
      groups:
        - google_play_credentials # Contains your Google Play JSON service account credentials
        - keystore_credentials    # Contains CM_KEYSTORE, CM_KEYSTORE_PASSWORD, CM_KEY_ALIAS, CM_KEY_PASSWORD
      node: latest
      java: 17
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'main'
          include: true
    scripts:
      - name: Install dependencies
        script: |
          npm install

      - name: Add Android Platform
        script: |
          npx cap add android

      - name: Copy Web Assets (Build Step)
        script: |
          npm run build

      - name: Sync Native Project
        script: |
          npx cap sync android

      - name: Set up keystore
        script: |
          # Codemagic environment variables automatically decode and write the keystore file
          echo $CM_KEYSTORE | base64 --decode > /tmp/keystore.jks
          
          # Inject keystore properties into gradle.properties
          cat << EOT >> android/gradle.properties
          MY_APP_UPLOAD_STORE_FILE=/tmp/keystore.jks
          MY_APP_UPLOAD_STORE_PASSWORD=$CM_KEYSTORE_PASSWORD
          MY_APP_UPLOAD_KEY_ALIAS=$CM_KEY_ALIAS
          MY_APP_UPLOAD_KEY_PASSWORD=$CM_KEY_PASSWORD
          EOT

      - name: Build Signed Android App Bundle (.aab)
        script: |
          cd android
          ./gradlew bundleRelease

    artifacts:
      - android/app/build/outputs/bundle/release/*.aab

    publishing:
      google_play:
        credentials: $GOOGLE_PLAY_SERVICE_ACCOUNT_CREDENTIALS 
        track: internal
        submit_as_draft: false
      email:
        recipients:
          - neilson_m@yahoo.com
