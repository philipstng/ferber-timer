workflows:
  android-debug:
    name: Build Android Debug APK
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      vars:
        PACKAGE_NAME: "com.ferbersleeptimer.babytracker"
      groups:
        - google_play_credentials # Contains GOOGLE_PLAY_SERVICE_ACCOUNT_CREDENTIALS
        - keystore_credentials    # Contains CM_KEYSTORE, CM_KEYSTORE_PASSWORD, CM_KEY_ALIAS, CM_KEY_PASSWORD
      node: latest
      java: 17
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: '*'
          include: true
    scripts:
      - name: Install dependencies
        script: |
          npm install

      - name: Copy Web Assets (Build Step)
        script: |
          npm run build

      - name: Sync Native Project
        script: |
          # Syncs your tracked android folder with web build assets and plugins
          npx @capacitor/cli sync android

      - name: Build Android Debug APK
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

    artifacts:
      - android/app/build/outputs/apk/debug/*.apk

