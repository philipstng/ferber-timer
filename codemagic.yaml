workflows:
  capacitor-ios-android:
    name: Capacitor App Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      node: latest
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install dependencies
        script: |
          npm ci

      - name: Build web assets
        script: |
          # Compiles web app into your webDir (e.g., dist or build)
          npm run build

      - name: Capacitor Sync
        script: |
          # Copies web assets to native folders (ios/android) and updates plugins
          npx cap sync

      - name: Build Android APK (Optional)
        script: |
          cd android
          ./gradlew assembleDebug

      - name: Build iOS App (Optional)
        script: |
          cd ios/App
          pod install
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Debug -sdk iphoneos build

    artifacts:
      - android/app/build/outputs/**/*.apk
      - build/ios/ipa/*.ipa
