workflows:
  android-release:
    name: Build Android Release AAB
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      vars:
        PACKAGE_NAME: "com.ferbersleeptimer.babytracker"
      groups:
        - keystore_credentials
      node: latest
      java: 17
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'main'
          include: true
    scripts:
      - name: Install dependencies
        script: |
          npm install

      - name: Build web app (Required for Capacitor)
        script: |
          npm run build  # Adjust if your frontend uses a different build script (e.g., ionic build)

      - name: Sync Native Project
        script: |
          npx cap sync android

      - name: Set up keystore
        script: |
          # Assuming your base64-encoded keystore is stored in an environment variable 
          echo $CM_KEYSTORE | base64 --decode > android/app/codemagic.keystore

      - name: Build Android Release AAB
        script: |
          cd android
          chmod +x gradlew
          ./gradlew clean bundleRelease \
            -PMY_APP_UPLOAD_STORE_FILE=codemagic.keystore \
            -PMY_APP_UPLOAD_STORE_PASSWORD="$CM_KEYSTORE_PASSWORD" \
            -PMY_APP_UPLOAD_KEY_ALIAS="$CM_KEY_ALIAS" \
            -PMY_APP_UPLOAD_KEY_PASSWORD="$CM_KEY_PASSWORD"

    artifacts:
      - android/app/build/outputs/bundle/release/*.aab
