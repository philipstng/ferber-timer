workflows:
  android-release:
    name: Build Android App Bundle (.aab)
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      vars:
        PACKAGE_NAME: "com.ferbersleeptimer.babytracker"
      node: latest
      java: 17
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'main'
          include: true
    scripts:
      - name: Install dependencies
        script: |
          npm install

      - name: Add and Sync Android Platform
        script: |
          npx cap add android
          npx cap sync android

      - name: Build Android App Bundle (.aab)
        script: |
          cd android
          ./gradlew bundleRelease

    artifacts:
      - android/app/build/outputs/bundle/release/*.aab
      - android/app/build/outputs/apk/release/*.apk

    publishing:
      email:
        recipients:
          - neilson_m@yahoo.com
