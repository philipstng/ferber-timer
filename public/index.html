<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ferber Sleep Training Timer</title>

    <!-- REQUIRED FOR CAPACITOR NATIVE BRIDGE -->
    <script src="capacitor.js"></script>
    
    <style>
        :root {
            /* Light Theme Variables */
            --bg-color: #F7F7F8;
            --card-bg: #FFFFFF;
            --text-primary: #111111;
            --text-secondary: #71717A;
            --control-bg: #E4E4E7;
            --active-pill-bg: #FFFFFF;
            --active-pill-text: #111111;
            --border-color: #E4E4E7;
            --btn-primary-bg: #111111;
            --btn-primary-text: #FFFFFF;
            --btn-pause-bg: #71717A;
            --shadow-color: rgba(0, 0, 0, 0.05);
        }

        [data-theme="dark"] {
            /* Dark Theme Variables (Wealthsimple Obsidian Style) */
            --bg-color: #0D0D0E;
            --card-bg: #18181B;
            --text-primary: #F4F4F5;
            --text-secondary: #A1A1AA;
            --control-bg: #27272A;
            --active-pill-bg: #3F3F46;
            --active-pill-text: #FFFFFF;
            --border-color: #27272A;
            --btn-primary-bg: #FFFFFF;
            --btn-primary-text: #111111;
            --btn-pause-bg: #3F3F46;
            --shadow-color: rgba(0, 0, 0, 0.4);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            transition: background-color 0.25s ease, color 0.25s ease, border-color 0.25s ease;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: transparent !important;
        }

        .app-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            max-width: 480px;
            margin: 0 auto;
            padding: 24px 20px;
            justify-content: space-between;
            background-color: var(--bg-color);
        }

        /* TOP SECTION */
        .top-section {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .title {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -0.3px;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .icon-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 6px;
            color: var(--text-primary);
            outline: none;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
        }

        .icon-btn svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .btn-label {
            font-size: 0.7rem;
            font-weight: 700;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-group {
            display: flex;
            background-color: var(--control-bg);
            padding: 3px;
            border-radius: 99px;
            gap: 3px;
        }

        /* Day Buttons */
        .day-btn {
            flex: 1;
            padding: 8px 0;
            border: none;
            border-radius: 99px;
            background-color: transparent;
            color: var(--text-secondary);
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .day-btn.active {
            background-color: var(--active-pill-bg);
            color: var(--active-pill-text);
            box-shadow: 0 2px 8px var(--shadow-color);
        }

        /* Check-in Buttons */
        .checkin-btn {
            flex: 1;
            padding: 8px 0;
            border: none;
            border-radius: 99px;
            background-color: transparent;
            color: var(--text-secondary);
            font-weight: 600;
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .checkin-btn.active {
            background-color: var(--active-pill-bg);
            color: var(--active-pill-text);
            box-shadow: 0 2px 8px var(--shadow-color);
        }

        /* MIDDLE SECTION */
        .middle-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .timer-circle {
            width: 65vw;
            height: 65vw;
            max-width: 260px;
            max-height: 260px;
            border-radius: 50%;
            border: 4px solid var(--border-color);
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: var(--card-bg);
            box-shadow: 0 12px 32px var(--shadow-color);
            transition: background-color 0.4s ease, border-color 0.4s ease;
        }

        .timer-circle.finished {
            background-color: #22C55E;
            border-color: #22C55E;
        }

        .timer-display {
            font-size: 3.5rem;
            font-weight: 700;
            color: var(--text-primary);
            font-variant-numeric: tabular-nums;
            letter-spacing: -1px;
        }

        .timer-circle.finished .timer-display {
            color: #FFFFFF;
        }

        /* BOTTOM SECTION / CONTROLS */
        .controls {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
        }

        .control-btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 16px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.1s ease, opacity 0.2s ease;
        }

        .start-btn { 
            background-color: var(--btn-primary-bg); 
            color: var(--btn-primary-text); 
        }

        .pause-btn { 
            background-color: var(--btn-pause-bg); 
            color: #FFFFFF; 
        }

        .reset-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 0.9rem;
            font-weight: 600;
            padding: 8px;
            cursor: pointer;
        }

        .control-btn:active, .reset-btn:active, .icon-btn:active {
            opacity: 0.8;
            transform: scale(0.98);
        }
    </style>
</head>

<body>

<div class="app-container">
    <!-- TOP SECTION -->
    <div class="top-section" style="margin-top: 10px;">
        <div class="header-row">
            <div class="title">Ferber Method</div>
            <div class="header-actions">
                <!-- Dark Mode Toggle Button -->
                <button class="icon-btn" id="themeToggle" aria-label="Toggle Theme">
                    <!-- Moon Icon (Shown in Light Mode) -->
                    <svg id="iconMoon" viewBox="0 0 24 24">
                        <path d="M12.3 2a10 10 0 0 0 9.7 11.6 10 10 0 1 1-11.6-9.7z"/>
                    </svg>
                    <!-- Sun Icon (Shown in Dark Mode) -->
                    <svg id="iconSun" viewBox="0 0 24 24" style="display: none;">
                        <path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zm-9-8c.55 0 1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1v2c0 .55.45 1 1 1zm0 16c-.55 0-1 .45-1 1v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1zM5.64 7.05c.39-.39.39-1.02 0-1.41L4.22 4.22c-.39-.39-1.02-.39-1.41 0s-.39 1.02 0 1.41l1.42 1.42c.39.39 1.02.39 1.41 0zm12.72 12.72c.39-.39.39-1.02 0-1.41l-1.42-1.42c-.39-.39-1.02-.39-1.41 0s-.39 1.02 0 1.41l1.42 1.42c.39.39 1.02.39 1.41 0zM7.05 18.36l-1.42 1.42c-.39.39-.39 1.02 0 1.41.39.39 1.02.39 1.41 0l1.42-1.42c.39-.39.39-1.02 0-1.41-.39-.38-1.03-.38-1.41 0zm12.72-12.72l-1.42 1.42c-.39.39-.39 1.02 0 1.41.39.39 1.02.39 1.41 0l1.42-1.42c.39-.39.39-1.02 0-1.41-.39-.39-1.02-.39-1.41 0z"/>
                    </svg>
                </button>
                <!-- Sound Toggle Button -->
                <button class="icon-btn" id="muteToggle" aria-label="Toggle Sound">
                    <svg id="iconUnmuted" viewBox="0 0 24 24">
                        <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
                    </svg>
                    <svg id="iconMuted" viewBox="0 0 24 24" style="display: none;">
                        <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>
                    </svg>
                </button>
            </div>
        </div>

        <!-- Day Selection Buttons -->
        <div class="control-group">
            <div class="btn-label">Day</div>
            <div class="btn-group">
                <button class="day-btn active" onclick="selectDay(1)">1</button>
                <button class="day-btn" onclick="selectDay(2)">2</button>
                <button class="day-btn" onclick="selectDay(3)">3</button>
                <button class="day-btn" onclick="selectDay(4)">4</button>
                <button class="day-btn" onclick="selectDay(5)">5</button>
                <button class="day-btn" onclick="selectDay(6)">6</button>
                <button class="day-btn" onclick="selectDay(7)">7</button>
            </div>
        </div>

        <!-- Check-In Selection Buttons -->
        <div class="control-group">
            <div class="btn-label">Check-In Interval</div>
            <div class="btn-group">
                <button class="checkin-btn active" onclick="selectCheckIn(1)">1st</button>
                <button class="checkin-btn" onclick="selectCheckIn(2)">2nd</button>
                <button class="checkin-btn" onclick="selectCheckIn(3)">3rd</button>
                <button class="checkin-btn" onclick="selectCheckIn(4)">Subseq.</button>
            </div>
        </div>
    </div>

    <!-- MIDDLE SECTION -->
    <div class="middle-section">
        <div class="timer-circle" id="timerCircle">
            <div class="timer-display" id="timerDisplay">03:00</div>
        </div>        
    </div>

    <!-- BOTTOM SECTION -->
    <div class="controls">
        <button class="control-btn start-btn" id="startBtn" onclick="toggleTimer()">Start Timer</button>
        <button class="reset-btn" onclick="resetTimer()">Reset</button>
    </div>

</div>

<script>
    const ferberMatrix = {
        1: { 1: 3,  2: 5,  3: 10, 4: 10 },
        2: { 1: 5,  2: 10, 3: 12, 4: 12 },
        3: { 1: 10, 2: 12, 3: 15, 4: 15 },
        4: { 1: 12, 2: 15, 3: 17, 4: 17 },
        5: { 1: 15, 2: 17, 3: 20, 4: 20 },
        6: { 1: 17, 2: 20, 3: 25, 4: 25 },
        7: { 1: 20, 2: 25, 3: 30, 4: 30 }
    };

    let selectedDay = 1;
    let selectedCheckIn = 1;
    let totalSeconds = 180;
    let remainingSeconds = 180;
    let timerInterval = null;
    let isRunning = false;
    let isMuted = false;
    let audioCtx = null;

    const timerDisplay = document.getElementById('timerDisplay');
    const timerCircle = document.getElementById('timerCircle');
    const startBtn = document.getElementById('startBtn');
    const muteToggle = document.getElementById('muteToggle');
    const iconUnmuted = document.getElementById('iconUnmuted');
    const iconMuted = document.getElementById('iconMuted');
    const themeToggle = document.getElementById('themeToggle');
    const iconMoon = document.getElementById('iconMoon');
    const iconSun = document.getElementById('iconSun');

    /* --- IN-MEMORY THEME TOGGLE LOGIC --- */
    let currentTheme = 'light';

    function setTheme(theme) {
        currentTheme = theme;
        document.documentElement.setAttribute('data-theme', theme);
        if (theme === 'dark') {
            iconMoon.style.display = 'none';
            iconSun.style.display = 'block';
        } else {
            iconMoon.style.display = 'block';
            iconSun.style.display = 'none';
        }
    }

    themeToggle.addEventListener('click', () => {
        const nextTheme = currentTheme === 'dark' ? 'light' : 'dark';
        setTheme(nextTheme);
    });

    /* --- TIMER LOGIC --- */
    function updateTimerSetting() {
        if (isRunning) pauseTimer();
        const minutes = ferberMatrix[selectedDay][selectedCheckIn];
        totalSeconds = minutes * 60;
        remainingSeconds = totalSeconds;
        timerCircle.classList.remove('finished');
        displayTime(remainingSeconds);
    }

    function displayTime(seconds) {
        const mins = Math.floor(seconds / 60);
        const secs = seconds % 60;
        timerDisplay.textContent = 
            `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
    }

    function selectDay(day) {
        selectedDay = day;
        document.querySelectorAll('.day-btn').forEach((btn, idx) => {
            btn.classList.toggle('active', idx + 1 === day);
        });
        updateTimerSetting();
    }

    function selectCheckIn(index) {
        selectedCheckIn = index;
        document.querySelectorAll('.checkin-btn').forEach((btn, idx) => {
            btn.classList.toggle('active', idx + 1 === index);
        });
        updateTimerSetting();
    }

    function toggleTimer() {
        if (isRunning) {
            pauseTimer();
        } else {
            startTimer();
        }
    }

    function startTimer() {
        if (remainingSeconds <= 0) return;
        
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }

        isRunning = true;
        startBtn.textContent = 'Pause Timer';
        startBtn.className = 'control-btn pause-btn';
        
        timerInterval = setInterval(() => {
            remainingSeconds--;
            displayTime(remainingSeconds);

            if (remainingSeconds <= 0) {
                clearInterval(timerInterval);
                timerFinished();
            }
        }, 1000);
    }

    function pauseTimer() {
        isRunning = false;
        clearInterval(timerInterval);
        startBtn.textContent = 'Start Timer';
        startBtn.className = 'control-btn start-btn';
    }

    function resetTimer() {
        pauseTimer();
        timerCircle.classList.remove('finished');
        remainingSeconds = totalSeconds;
        displayTime(remainingSeconds);
    }

    function timerFinished() {
        isRunning = false;
        startBtn.textContent = 'Start Timer';
        startBtn.className = 'control-btn start-btn';
        timerCircle.classList.add('finished');
        
        if (!isMuted) {
            playAlarm();
        }
    }

    function playAlarm() {
        if (!audioCtx) return;
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }

        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(880, now);

        gain.gain.setValueAtTime(0, now);
        for (let i = 0; i < 3; i++) {
            gain.gain.setValueAtTime(0.3, now + i);
            gain.gain.setValueAtTime(0, now + i + 0.6);
        }

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start(now);
        osc.stop(now + 3);
    }

    muteToggle.addEventListener('click', () => {
        isMuted = !isMuted;
        if (isMuted) {
            iconUnmuted.style.display = 'none';
            iconMuted.style.display = 'block';
        } else {
            iconUnmuted.style.display = 'block';
            iconMuted.style.display = 'none';
        }
    });

    displayTime(remainingSeconds);
</script>

</body>
</html>
