<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ferber Sleep Training Timer</title>

    <!-- REQUIRED FOR CAPACITOR NATIVE BRIDGE -->
    <script src="capacitor.js"></script>
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: transparent !important;
        }

        .app-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            max-width: 480px;
            margin: 0 auto;
            padding: 24px 20px;
            justify-content: space-between;
            background-color: #F7F7F8; /* Wealthsimple-style clean light grey */
        }

        /* TOP SECTION */
        .top-section {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .title {
            font-size: 1.1rem;
            font-weight: 700;
            color: #111111;
            letter-spacing: -0.3px;
        }

        .mute-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 4px;
            color: #111111;
            outline: none;
        }

        .mute-btn svg {
            width: 24px;
            height: 24px;
            fill: currentColor;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .btn-label {
            font-size: 0.7rem;
            font-weight: 700;
            color: #71717A;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-group {
            display: flex;
            background-color: #E4E4E7;
            padding: 3px;
            border-radius: 99px; /* Fully rounded capsule container */
            gap: 3px;
        }

        /* Day Buttons */
        .day-btn {
            flex: 1;
            padding: 8px 0;
            border: none;
            border-radius: 99px;
            background-color: transparent;
            color: #71717A;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .day-btn.active {
            background-color: #FFFFFF;
            color: #111111;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        /* Check-in Buttons */
        .checkin-btn {
            flex: 1;
            padding: 8px 0;
            border: none;
            border-radius: 99px;
            background-color: transparent;
            color: #71717A;
            font-weight: 600;
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .checkin-btn.active {
            background-color: #FFFFFF;
            color: #111111;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        /* MIDDLE SECTION */
        .middle-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .timer-circle {
            width: 65vw;
            height: 65vw;
            max-width: 260px;
            max-height: 260px;
            border-radius: 50%;
            border: 4px solid #E4E4E7;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #FFFFFF;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.03);
            transition: background-color 0.4s ease, border-color 0.4s ease;
        }

        .timer-circle.finished {
            background-color: #111111;
            border-color: #111111;
        }

        .timer-display {
            font-size: 3.5rem;
            font-weight: 700;
            color: #111111;
            font-variant-numeric: tabular-nums;
            letter-spacing: -1px;
        }

        .timer-circle.finished .timer-display {
            color: #FFFFFF;
        }

        /* BOTTOM SECTION / CONTROLS */
        .controls {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
        }

        .control-btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 16px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.1s ease, opacity 0.2s ease;
        }

        .start-btn { 
            background-color: #111111; 
            color: #FFFFFF; 
        }

        .pause-btn { 
            background-color: #71717A; 
            color: #FFFFFF; 
        }

        .reset-btn {
            background: none;
            border: none;
            color: #71717A;
            font-size: 0.9rem;
            font-weight: 600;
            padding: 8px;
            cursor: pointer;
        }

        .control-btn:active, .reset-btn:active {
            opacity: 0.8;
            transform: scale(0.98);
        }
    </style>
</head>

<body>

<div class="app-container">
    <!-- TOP SECTION -->
    <div class="top-section" style="margin-top: 10px;">
        <div class="header-row">
            <div class="title">Ferber Method</div>
            <button class="mute-btn" id="muteToggle" aria-label="Toggle Sound">
                <!-- Speaker Unmuted Icon -->
                <svg id="iconUnmuted" viewBox="0 0 24 24">
                    <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
                </svg>
                <!-- Speaker Muted Icon -->
                <svg id="iconMuted" viewBox="0 0 24 24" style="display: none;">
                    <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>
                </svg>
            </button>
        </div>

        <!-- Day Selection Buttons -->
        <div class="control-group">
            <div class="btn-label">Day</div>
            <div class="btn-group">
                <button class="day-btn active" onclick="selectDay(1)">1</button>
                <button class="day-btn" onclick="selectDay(2)">2</button>
                <button class="day-btn" onclick="selectDay(3)">3</button>
                <button class="day-btn" onclick="selectDay(4)">4</button>
                <button class="day-btn" onclick="selectDay(5)">5</button>
                <button class="day-btn" onclick="selectDay(6)">6</button>
                <button class="day-btn" onclick="selectDay(7)">7</button>
            </div>
        </div>

        <!-- Check-In Selection Buttons -->
        <div class="control-group">
            <div class="btn-label">Check-In Interval</div>
            <div class="btn-group">
                <button class="checkin-btn active" onclick="selectCheckIn(1)">1st</button>
                <button class="checkin-btn" onclick="selectCheckIn(2)">2nd</button>
                <button class="checkin-btn" onclick="selectCheckIn(3)">3rd</button>
                <button class="checkin-btn" onclick="selectCheckIn(4)">Subseq.</button>
            </div>
        </div>
    </div>

    <!-- MIDDLE SECTION -->
    <div class="middle-section">
        <div class="timer-circle" id="timerCircle">
            <div class="timer-display" id="timerDisplay">03:00</div>
        </div>        
    </div>

    <!-- BOTTOM SECTION -->
    <div class="controls">
        <button class="control-btn start-btn" id="startBtn" onclick="toggleTimer()">Start Timer</button>
        <button class="reset-btn" onclick="resetTimer()">Reset</button>
    </div>

</div>

<script>
    const ferberMatrix = {
        1: { 1: 3,  2: 5,  3: 10, 4: 10 },
        2: { 1: 5,  2: 10, 3: 12, 4: 12 },
        3: { 1: 10, 2: 12, 3: 15, 4: 15 },
        4: { 1: 12, 2: 15, 3: 17, 4: 17 },
        5: { 1: 15, 2: 17, 3: 20, 4: 20 },
        6: { 1: 17, 2: 20, 3: 25, 4: 25 },
        7: { 1: 20, 2: 25, 3: 30, 4: 30 }
    };

    let selectedDay = 1;
    let selectedCheckIn = 1;
    let totalSeconds = 180;
    let remainingSeconds = 180;
    let timerInterval = null;
    let isRunning = false;
    let isMuted = false;
    let audioCtx = null;

    const timerDisplay = document.getElementById('timerDisplay');
    const timerCircle = document.getElementById('timerCircle');
    const startBtn = document.getElementById('startBtn');
    const muteToggle = document.getElementById('muteToggle');
    const iconUnmuted = document.getElementById('iconUnmuted');
    const iconMuted = document.getElementById('iconMuted');

    function updateTimerSetting() {
        if (isRunning) pauseTimer();
        const minutes = ferberMatrix[selectedDay][selectedCheckIn];
        totalSeconds = minutes * 60;
        remainingSeconds = totalSeconds;
        timerCircle.classList.remove('finished');
        displayTime(remainingSeconds);
    }

    function displayTime(seconds) {
        const mins = Math.floor(seconds / 60);
        const secs = seconds % 60;
        timerDisplay.textContent = 
            `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
    }

    function selectDay(day) {
        selectedDay = day;
        document.querySelectorAll('.day-btn').forEach((btn, idx) => {
            btn.classList.toggle('active', idx + 1 === day);
        });
        updateTimerSetting();
    }

    function selectCheckIn(index) {
        selectedCheckIn = index;
        document.querySelectorAll('.checkin-btn').forEach((btn, idx) => {
            btn.classList.toggle('active', idx + 1 === index);
        });
        updateTimerSetting();
    }

    function toggleTimer() {
        if (isRunning) {
            pauseTimer();
        } else {
            startTimer();
        }
    }

    function startTimer() {
        if (remainingSeconds <= 0) return;
        
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }

        isRunning = true;
        startBtn.textContent = 'Pause Timer';
        startBtn.className = 'control-btn pause-btn';
        
        timerInterval = setInterval(() => {
            remainingSeconds--;
            displayTime(remainingSeconds);

            if (remainingSeconds <= 0) {
                clearInterval(timerInterval);
                timerFinished();
            }
        }, 1000);
    }

    function pauseTimer() {
        isRunning = false;
        clearInterval(timerInterval);
        startBtn.textContent = 'Start Timer';
        startBtn.className = 'control-btn start-btn';
    }

    function resetTimer() {
        pauseTimer();
        timerCircle.classList.remove('finished');
        remainingSeconds = totalSeconds;
        displayTime(remainingSeconds);
    }

    function timerFinished() {
        isRunning = false;
        startBtn.textContent = 'Start Timer';
        startBtn.className = 'control-btn start-btn';
        timerCircle.classList.add('finished');
        
        if (!isMuted) {
            playAlarm();
        }
    }

    function playAlarm() {
        if (!audioCtx) return;
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }

        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(880, now);

        gain.gain.setValueAtTime(0, now);
        for (let i = 0; i < 3; i++) {
            gain.gain.setValueAtTime(0.3, now + i);
            gain.gain.setValueAtTime(0, now + i + 0.6);
        }

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start(now);
        osc.stop(now + 3);
    }

    muteToggle.addEventListener('click', () => {
        isMuted = !isMuted;
        if (isMuted) {
            iconUnmuted.style.display = 'none';
            iconMuted.style.display = 'block';
        } else {
            iconUnmuted.style.display = 'block';
            iconMuted.style.display = 'none';
        }
    });

    displayTime(remainingSeconds);
</script>

</body>
</html>
